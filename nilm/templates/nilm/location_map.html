{% extends "vertical.html" %}
{% load static i18n %}

{% block title %}{% trans "Mapa" %} | DOMOBOI{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'location_field/leaflet/leaflet.css' %}"/>
{% endblock %}

{% block page_content %}

  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <div id="locations-map" style="height: 70vh; min-height: 400px;"></div>
  </div>

{% endblock %}

{% block extra_javascript %}
<script id="locations-map-data" type="application/json">{{ location_map_json|safe }}</script>
<script src="{% static 'location_field/leaflet/leaflet.js' %}"></script>
<script>
(function () {
  var L = window.L || window.leaflet;
  if (!L) return;
  var container = document.getElementById('locations-map');
  if (!container || container._leaflet_id) return;
  var locations = JSON.parse(document.getElementById('locations-map-data').textContent);
  var center = locations.length ? [locations[0].lat, locations[0].lon] : [41.05, 0.43];
  var map = L.map(container).setView(center, 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);
  var bounds = [];
  locations.forEach(function (loc) {
    var marker = L.circleMarker([loc.lat, loc.lon], {
      radius: 10, fillColor: '#7c3aed', color: '#fff', weight: 2, fillOpacity: 0.85
    }).addTo(map);
    marker.bindPopup(
      '<strong class="text-sm">' + loc.description + '</strong><br>' +
      '<a href="/nilm/locations/' + loc.pk + '/" ' +
         'style="color:#7c3aed;font-size:0.8em;font-weight:600;">{% trans "Explorar" %} →</a>'
    );
    bounds.push([loc.lat, loc.lon]);
  });
  setTimeout(function () {
    map.invalidateSize();
    if (bounds.length > 1) map.fitBounds(bounds, {padding: [40, 40]});
  }, 150);
})();
</script>
{% endblock %}
