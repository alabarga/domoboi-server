{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>
{% if form.errors %}
    <div class="alert alert-danger mt-3">Invalid username or password.</div>
{% endif %}
{% endblock %}
