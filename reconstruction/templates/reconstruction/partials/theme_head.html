{% comment %} Estilos propios de reconstruction (el tema claro/oscuro vive en base.html). {% endcomment %}
<style>
  /* ─── Botones propios de reconstruction ─────────────────────────────── */
  .rc-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 8px; cursor: pointer;
    background: var(--surface-raised); color: var(--text-primary);
    border: 1px solid var(--border);
  }
  .rc-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── Resaltado de la fila a la que lleva un clic en la gráfica ─────── */
  @keyframes rc-rowflash {
    0%, 65% { background: var(--accent-flash); box-shadow: inset 0 0 0 2px var(--accent); }
    100%    { background: transparent;          box-shadow: inset 0 0 0 2px transparent; }
  }
  .row-flash { animation: rc-rowflash 2.8s ease-out; }
  .rc-row { scroll-margin-top: 90px; }

  /* Calendario | lista: dos columnas desde 768 px, apiladas en móvil */
  .rc-split { display: grid; gap: 24px; align-items: start; }
  @media (min-width: 768px) { .rc-split { grid-template-columns: 300px minmax(0, 1fr); } }

  /* Contenedor de la gráfica: alto fijo y relativo (Chart.js lo necesita para no deformarse) */
  .chart-box { position: relative; width: 100%; min-width: 0; }
  .chart-box canvas { display: block; }

  html[data-theme="light"] pre.json-box { background: var(--surface-raised); }
  pre.json-box {
    margin: 0; padding: 8px 10px; border-radius: 8px; font-size: 11px; line-height: 1.4;
    max-height: 260px; overflow: auto; background: var(--bg); color: var(--text-primary);
    white-space: pre-wrap; word-break: break-all;
  }
</style>
