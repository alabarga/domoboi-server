{% load static %}
<div id="gmaps-markers" class="gmaps" style="height: 300px;"></div>
{% if locations %}
  <script id="marker-data" type="application/json">
    [
    {% for location in locations %}
      {"lat": {{ location.location|cut:' '|cut:','|slice:':8' }}, "lng": {{ location.location|cut:' '|cut:','|slice:'9:' }}, "title": "{{ location.description|escapejs }}"}{% if not forloop.last %},{% endif %}
    {% endfor %}
    ]
  </script>
{% endif %}
<script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}"></script>
<script src="{% static 'vendor/gmaps/gmaps.min.js' %}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('gmaps-markers')) {
      var markerData = [];
      try {
        markerData = JSON.parse(document.getElementById('marker-data').textContent);
      } catch (e) {}
      var center = markerData.length ? markerData[0] : {lat: 41.3874, lng: 2.1686};
      var map = new GMaps({
        div: '#gmaps-markers',
        lat: center.lat,
        lng: center.lng,
        zoom: 12
      });
      markerData.forEach(function(marker) {
        map.addMarker(marker);
      });
    }
  });
</script>
